name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "lite=联网小包"
        required: true
        default: "lite"
        type: choice
        options:
          - lite

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: gameios_repo_v1.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-lite.yml

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Jiuzhou.xcodeproj \
            -scheme Jiuzhou \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -30

      - name: Package IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/Jiuzhou.app"
          test -d "$APP" || { echo "编译产物不存在"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qrX Jiuzhou-lite-unsigned.ipa Payload
          echo "IPA 大小: $(du -h Jiuzhou-lite-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jiuzhou-ipa
          path: gameios_repo_v1.2.1/build/Jiuzhou-lite-unsigned.ipa
